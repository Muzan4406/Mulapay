openapi: 3.1.0
info:
  title: Api
  version: 0.2.0
  description: Mulapay wallet, ledger, KYC and operations API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: wallet
  - name: operations
  - name: admin
  - name: payin
  - name: public
paths:
  /v1/profile/sync-email:
    post:
      operationId: syncVerifiedProfileEmail
      tags: [wallet]
      responses:
        "200":
          description: Adresse principale vérifiée synchronisée depuis Clerk
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminCommandResult" }
  /v1/admin/console:
    get:
      operationId: getAdminConsole
      tags: [admin]
      parameters:
        - { name: section, in: query, required: true, schema: { type: string, enum: [dashboard, merchants, kyc, transactions, wallets, exchanges, providers, operators, api-keys, payment-links, blacklist, messages, notifications, settings] } }
        - { name: q, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string } }
        - { name: country, in: query, schema: { type: string } }
        - { name: type, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: number, minimum: 1 } }
      responses:
        "200":
          description: Administration réelle, par section et paginée
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminConsoleState" }
  /v1/admin/console/commands:
    post:
      operationId: executeAdminCommand
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminCommandInput" }
      responses:
        "200":
          description: Action enregistrée
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminCommandResult" }
  /v1/announcements:
    get:
      operationId: listAnnouncements
      tags: [wallet]
      responses:
        "200":
          description: Publications actives non fermées
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AdminAnnouncement" }
  /v1/announcements/{id}/dismiss:
    post:
      operationId: dismissAnnouncement
      tags: [wallet]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Publication fermée pour ce compte
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminCommandResult" }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Returns server health
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /v1/bootstrap:
    get:
      operationId: getBootstrap
      tags: [wallet]
      summary: Loads the authenticated Mulapay workspace
      security:
        - MulapayApiKey: []
      responses:
        "200":
          description: Workspace state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bootstrap"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/transfers:
    post:
      operationId: createTransfer
      tags: [wallet]
      summary: Sends funds to another Mulapay user
      security:
        - MulapayApiKey: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferInput"
      responses:
        "201":
          description: Transfer created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationResult"
        "400":
          $ref: "#/components/responses/BadRequest"
  /v1/exchanges:
    post:
      operationId: createExchange
      tags: [wallet]
      summary: Requests an inter-wallet exchange
      security:
        - MulapayApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExchangeInput"
      responses:
        "201":
          description: Exchange request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationResult"
  /v1/exchanges/{id}/decision:
    patch:
      operationId: decideExchange
      tags: [admin]
      summary: Approves or rejects an exchange request
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecisionInput"
      responses:
        "200":
          description: Decision applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationResult"
  /v1/payment-links:
    post:
      operationId: createPaymentLink
      tags: [wallet]
      summary: Creates a payment link
      security:
        - MulapayApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentLinkInput"
      responses:
        "201":
          description: Payment link created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentLink"
    get:
      operationId: listPaymentLinks
      tags: [wallet]
      summary: Lists payment links
      security:
        - MulapayApiKey: []
      responses:
        "200":
          description: Payment links
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PaymentLink"
  /v1/public/payment-links/{token}:
    get:
      operationId: getPublicPaymentLink
      tags: [public]
      summary: Loads a public payment link
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Public payment link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicPaymentLink"
        "404":
          description: Payment link not found
        "410":
          description: Payment link no longer available
  /v1/public/payment-links/{token}/payments:
    post:
      operationId: createPublicPayment
      tags: [public]
      summary: Starts a real payment for a public payment link
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicPaymentInput"
      responses:
        "201":
          description: Payment initiated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationResult"
  /v1/public/payment-links/{token}/payments/{reference}:
    get:
      operationId: getPublicPayment
      tags: [public]
      summary: Gets the status of a public payment
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/Reference"
      responses:
        "200":
          description: Public payment status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentStatus"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/payment-links/{id}:
    patch:
      operationId: updatePaymentLink
      tags: [wallet]
      summary: Updates an owned payment link
      security:
        - MulapayApiKey: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentLinkInput"
      responses:
        "200":
          description: Payment link updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentLink"
    delete:
      operationId: deletePaymentLink
      tags: [wallet]
      summary: Permanently deletes a payment link
      security:
        - MulapayApiKey: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Payment link deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationResult"
  /v1/deposits:
    post:
      operationId: createDeposit
      tags: [payin]
      summary: Starts a Mulapay Mobile Money payment
      security:
        - MulapayApiKey: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DepositInput"
      responses:
        "200":
          description: Existing payin returned for a repeated idempotent request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationResult"
        "201":
          description: Mulapay payment request created and awaiting confirmation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ProviderUnavailable"
  /v1/deposits/{reference}:
    get:
      operationId: getDeposit
      tags: [payin]
      summary: Gets the local status of a payin
      security:
        - MulapayApiKey: []
      parameters:
        - $ref: "#/components/parameters/Reference"
      responses:
        "200":
          description: Payin status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentStatus"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/withdrawals:
    post:
      operationId: createWithdrawal
      tags: [wallet]
      summary: Starts a provider-backed withdrawal
      security:
        - MulapayApiKey: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MoneyOperationInput"
      responses:
        "201":
          description: Withdrawal request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationResult"
  /v1/notifications/{id}/read:
    patch:
      operationId: markNotificationRead
      tags: [wallet]
      summary: Marks a notification as read
      security:
        - MulapayApiKey: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Notification updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationResult"
  /v1/notifications/{id}:
    delete:
      operationId: deleteNotification
      tags: [wallet]
      summary: Deletes an owned notification
      security:
        - MulapayApiKey: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Notification deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationResult"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/notifications/read-all:
    patch:
      operationId: markAllNotificationsRead
      tags: [wallet]
      summary: Marks all account notifications as read
      security:
        - MulapayApiKey: []
      responses:
        "200":
          description: Notifications updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationResult"
  /v1/withdrawals/{reference}:
    get:
      operationId: getWithdrawal
      tags: [wallet]
      summary: Gets the local status of a withdrawal
      security:
        - MulapayApiKey: []
      parameters:
        - $ref: "#/components/parameters/Reference"
      responses:
        "200":
          description: Withdrawal status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentStatus"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/payments/{reference}:
    get:
      operationId: getPayment
      tags: [payin]
      summary: Gets the status of a payment created from a payment link
      security:
        - MulapayApiKey: []
      parameters:
        - $ref: "#/components/parameters/Reference"
      responses:
        "200":
          description: Payment status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentStatus"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/security/pin:
    get:
      operationId: getSecurityPinStatus
      tags: [wallet]
      summary: Gets the current user's PIN status
      responses:
        "200":
          description: PIN status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecurityPinStatus"
    put:
      operationId: updateSecurityPin
      tags: [wallet]
      summary: Creates or replaces the current user's security PIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SecurityPinInput"
      responses:
        "200":
          description: PIN updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationResult"
  /v1/security/events:
    post:
      operationId: recordSecurityEvent
      tags: [wallet]
      summary: Records a completed account-security change
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SecurityEventInput"
      responses:
        "200":
          description: Event recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationResult"
  /v1/security/sessions/{sessionId}/revoke:
    post:
      operationId: revokeSecuritySession
      tags: [wallet]
      summary: Revokes one of the current user's Clerk sessions
      parameters:
        - in: path
          name: sessionId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Session revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationResult"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/profile:
    put:
      operationId: updateProfile
      tags: [wallet]
      summary: Updates the current user's personal information and preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileInput"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
  /v1/kyc:
    post:
      operationId: submitKyc
      tags: [wallet]
      summary: Submits KYC information for review
      security:
        - MulapayApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KycInput"
      responses:
        "201":
          description: KYC submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KycVerification"
  /v1/kyc/uploads/request-url:
    post:
      operationId: requestKycUploadUrl
      tags: [wallet]
      summary: Creates a private upload URL for a KYC image
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KycUploadInput"
      responses:
        "200":
          description: Private upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KycUploadResponse"
  /v1/admin/summary:
    get:
      operationId: getAdminSummary
      tags: [admin]
      summary: Loads operations summary
      responses:
        "200":
          description: Operations summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSummary"
  /v1/admin/settings:
    get:
      operationId: getAdminSettings
      tags: [admin]
      summary: Loads platform fee settings
      responses:
        "200":
          description: Platform settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSettings"
    patch:
      operationId: updateAdminSettings
      tags: [admin]
      summary: Updates platform fee settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAdminSettingsInput"
      responses:
        "200":
          description: Updated platform settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSettings"
  /v1/admin/payment-providers:
    get:
      operationId: listAdminPaymentProviders
      tags: [admin]
      summary: Lists payment provider configuration status
      responses:
        "200":
          description: Provider status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPaymentProviders"
  /v1/admin/payment-provider-routes:
    get:
      operationId: listAdminPaymentProviderRoutes
      tags: [admin]
      summary: Lists country and operator provider routes
      responses:
        "200":
          description: Provider routes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PaymentProviderRoute"
    put:
      operationId: upsertAdminPaymentProviderRoute
      tags: [admin]
      summary: Selects a provider for a country and operator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentProviderRouteInput"
      responses:
        "200":
          description: Provider route saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentProviderRoute"
  /v1/admin/kyc:
    get:
      operationId: listAdminKyc
      tags: [admin]
      summary: Lists KYC cases for operations
      responses:
        "200":
          description: KYC cases
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/KycVerification"
  /v1/admin/kyc/{id}/decision:
    patch:
      operationId: decideKyc
      tags: [admin]
      summary: Applies a KYC decision
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecisionInput"
      responses:
        "200":
          description: KYC decision applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationResult"
  /v1/admin/kyc/{id}/documents/{kind}:
    get:
      operationId: getAdminKycDocument
      tags: [admin]
      summary: Streams a KYC image to an authenticated compliance reviewer
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: kind
          in: path
          required: true
          schema:
            type: string
            enum: [document_front, document_back, face_capture]
      responses:
        "200":
          description: Private KYC image
          content:
            image/*: {}
  /v1/admin/transactions:
    get:
      operationId: listAdminTransactions
      tags: [admin]
      summary: Lists the operations ledger
      responses:
        "200":
          description: Transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Transaction"
components:
  # Administration console contracts never contain stored credential values.
  securitySchemes:
    MulapayApiKey:
      type: http
      scheme: bearer
      bearerFormat: mp_live_<server_key>
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
    Reference:
      name: reference
      in: path
      required: true
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Stable unique key for one payment attempt. Reuse it only when safely retrying the same request.
      schema:
        type: string
        minLength: 1
        maxLength: 128
  responses:
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ProviderUnavailable:
      description: Payment provider unavailable or not configured
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    AdminConfiguration:
      type: object
      properties:
        payinFee: { type: number, minimum: 0, maximum: 100 }
        payoutFee: { type: number, minimum: 0, maximum: 100 }
        depositMin: { type: number, minimum: 1 }
        depositMax: { type: number, minimum: 1 }
        withdrawalMin: { type: number, minimum: 1 }
        withdrawalMax: { type: number, minimum: 1 }
        maintenance: { type: boolean }
        maintenanceMessage: { type: string }
        payinMaintenance: { type: boolean }
        payoutMaintenance: { type: boolean }
        linksMaintenance: { type: boolean }
        apiMaintenance: { type: boolean }
        supportEmail: { type: string }
        supportWhatsapp: { type: string }
        statsSince: { type: ["string", "null"] }
    AdminAnnouncement:
      type: object
      required: [id, title, body, createdAt]
      properties:
        id: { type: string }
        title: { type: string }
        body: { type: string }
        createdAt: { type: string }
    AdminConsoleRow:
      type: object
      required: [id]
      properties:
        id: { type: string }
        userId: { type: string }
        merchantName: { type: string }
        firstName: { type: string }
        lastName: { type: string }
        email: { type: string }
        phone: { type: ["string", "null"] }
        role: { type: string }
        country: { type: string }
        countryCode: { type: string }
        code: { type: string }
        currency: { type: string }
        status: { type: string }
        kycStatus: { type: string }
        payinEnabled: { type: boolean }
        payoutEnabled: { type: boolean }
        payinFee: { type: ["number", "null"] }
        payoutFee: { type: ["number", "null"] }
        balance: { type: number }
        pending: { type: number }
        available: { type: number }
        count: { type: number }
        active: { type: number }
        createdAt: { type: string }
        type: { type: string }
        amount: { type: number }
        fee: { type: number }
        reference: { type: string }
        operator: { type: ["string", "null"] }
        providerOperator: { type: string }
        provider: { type: string }
        enabled: { type: boolean }
        configured: { type: boolean }
        dailyLimit: { type: ["number", "null"] }
        dailyUsed: { type: number }
        dailyRemaining: { type: ["number", "null"] }
        source: { type: string }
        destination: { type: string }
        sourceWalletId: { type: ["string", "null"] }
        destinationWalletId: { type: ["string", "null"] }
        rate: { type: number }
        receivedAmount: { type: number }
        requestedAt: { type: string }
        keyPrefix: { type: string }
        name: { type: string }
        scopes: { type: array, items: { type: string } }
        lastUsedAt: { type: ["string", "null"] }
        slug: { type: string }
        productName: { type: string }
        description: { type: string }
        payments: { type: number }
        maxPayments: { type: ["number", "null"] }
        amountType: { type: string }
        amountMin: { type: number }
        amountMax: { type: number }
        expiresAt: { type: string }
        reason: { type: string }
        title: { type: string }
        body: { type: string }
        subject: { type: string }
        recipient: { type: string }
        error: { type: ["string", "null"] }
        url: { type: string }
        method: { type: string }
        path: { type: string }
        keyId: { type: string }
        linkId: { type: string }
        responseStatus: { type: number }
        wallets:
          type: array
          items: { $ref: "#/components/schemas/Wallet" }
        documents:
          type: array
          items: { $ref: "#/components/schemas/AdminDocument" }
    AdminDocument:
      type: object
      required: [kind, fileName, url]
      properties:
        kind: { type: string }
        fileName: { type: string }
        url: { type: string }
    AdminConsoleState:
      type: object
      required: [section, items, total, page, pageSize, settings, telegramConfigured, emailConfigured]
      properties:
        section: { type: string }
        items:
          type: array
          items: { $ref: "#/components/schemas/AdminConsoleRow" }
        activity:
          type: array
          items: { $ref: "#/components/schemas/AdminConsoleRow" }
        stats:
          type: object
          additionalProperties: { type: number }
        currencyTotals:
          type: array
          items: { $ref: "#/components/schemas/AdminConsoleRow" }
        total: { type: number }
        page: { type: number }
        pageSize: { type: number }
