openapi: 3.1.0
info:
  title: Api
  version: 0.2.0
  description: Mulapay wallet, ledger, KYC and operations API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: wallet
  - name: operations
  - name: admin
  - name: payin
  - name: public
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Returns server health
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /v1/bootstrap:
    get:
      operationId: getBootstrap
      tags: [wallet]
      summary: Loads the authenticated Mulapay workspace
      security:
        - MulapayApiKey: []
      responses:
        "200":
          description: Workspace state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bootstrap"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/transfers:
    post:
      operationId: createTransfer
      tags: [wallet]
      summary: Sends funds to another Mulapay user
      security:
        - MulapayApiKey: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferInput"
      responses:
        "201":
          description: Transfer created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationResult"
        "400":
          $ref: "#/components/responses/BadRequest"
  /v1/exchanges:
    post:
      operationId: createExchange
      tags: [wallet]
      summary: Requests an inter-wallet exchange
      security:
        - MulapayApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExchangeInput"
      responses:
        "201":
          description: Exchange request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationResult"
  /v1/exchanges/{id}/decision:
    patch:
      operationId: decideExchange
      tags: [admin]
      summary: Approves or rejects an exchange request
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecisionInput"
      responses:
        "200":
          description: Decision applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationResult"
  /v1/payment-links:
    post:
      operationId: createPaymentLink
      tags: [wallet]
      summary: Creates a payment link
      security:
        - MulapayApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentLinkInput"
      responses:
        "201":
          description: Payment link created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentLink"
    get:
      operationId: listPaymentLinks
      tags: [wallet]
      summary: Lists payment links
      security:
        - MulapayApiKey: []
      responses:
        "200":
          description: Payment links
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PaymentLink"
  /v1/public/payment-links/{token}:
    get:
      operationId: getPublicPaymentLink
      tags: [public]
      summary: Loads a public payment link
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Public payment link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicPaymentLink"
        "404":
          description: Payment link not found
        "410":
          description: Payment link no longer available
  /v1/public/payment-links/{token}/payments:
    post:
      operationId: createPublicPayment
      tags: [public]
      summary: Starts a real payment for a public payment link
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicPaymentInput"
      responses:
        "201":
          description: Payment initiated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationResult"
  /v1/public/payment-links/{token}/payments/{reference}:
    get:
      operationId: getPublicPayment
      tags: [public]
      summary: Gets the status of a public payment
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/Reference"
      responses:
        "200":
          description: Public payment status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentStatus"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/payment-links/{id}:
    patch:
      operationId: updatePaymentLink
      tags: [wallet]
      summary: Updates an owned payment link
      security:
        - MulapayApiKey: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentLinkInput"
      responses:
        "200":
          description: Payment link updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentLink"
    delete:
      operationId: deletePaymentLink
      tags: [wallet]
      summary: Permanently deletes a payment link
      security:
        - MulapayApiKey: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Payment link deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationResult"
  /v1/deposits:
    post:
      operationId: createDeposit
      tags: [payin]
      summary: Starts a Mulapay Mobile Money payment
      security:
        - MulapayApiKey: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DepositInput"
      responses:
        "200":
          description: Existing payin returned for a repeated idempotent request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationResult"
        "201":
          description: Mulapay payment request created and awaiting confirmation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ProviderUnavailable"
  /v1/deposits/{reference}:
    get:
      operationId: getDeposit
      tags: [payin]
      summary: Gets the local status of a payin
      security:
        - MulapayApiKey: []
      parameters:
        - $ref: "#/components/parameters/Reference"
      responses:
        "200":
          description: Payin status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentStatus"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/withdrawals:
    post:
      operationId: createWithdrawal
      tags: [wallet]
      summary: Starts a provider-backed withdrawal
      security:
        - MulapayApiKey: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MoneyOperationInput"
      responses:
        "201":
          description: Withdrawal request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationResult"
  /v1/notifications/{id}/read:
    patch:
      operationId: markNotificationRead
      tags: [wallet]
      summary: Marks a notification as read
      security:
        - MulapayApiKey: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Notification updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationResult"
  /v1/withdrawals/{reference}:
    get:
      operationId: getWithdrawal
      tags: [wallet]
      summary: Gets the local status of a withdrawal
      security:
        - MulapayApiKey: []
      parameters:
        - $ref: "#/components/parameters/Reference"
      responses:
        "200":
          description: Withdrawal status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentStatus"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/payments/{reference}:
    get:
      operationId: getPayment
      tags: [payin]
      summary: Gets the status of a payment created from a payment link
      security:
        - MulapayApiKey: []
      parameters:
        - $ref: "#/components/parameters/Reference"
      responses:
        "200":
          description: Payment status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentStatus"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/kyc:
    post:
      operationId: submitKyc
      tags: [wallet]
      summary: Submits KYC information for review
      security:
        - MulapayApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KycInput"
      responses:
        "201":
          description: KYC submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KycVerification"
  /v1/admin/summary:
    get:
      operationId: getAdminSummary
      tags: [admin]
      summary: Loads operations summary
      responses:
        "200":
          description: Operations summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSummary"
  /v1/admin/settings:
    get:
      operationId: getAdminSettings
      tags: [admin]
      summary: Loads platform fee settings
      responses:
        "200":
          description: Platform settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSettings"
    patch:
      operationId: updateAdminSettings
      tags: [admin]
      summary: Updates platform fee settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAdminSettingsInput"
      responses:
        "200":
          description: Updated platform settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSettings"
  /v1/admin/payment-providers:
    get:
      operationId: listAdminPaymentProviders
      tags: [admin]
      summary: Lists payment provider configuration status
      responses:
        "200":
          description: Provider status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPaymentProviders"
  /v1/admin/payment-provider-routes:
    get:
      operationId: listAdminPaymentProviderRoutes
      tags: [admin]
      summary: Lists country and operator provider routes
      responses:
        "200":
          description: Provider routes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PaymentProviderRoute"
    put:
      operationId: upsertAdminPaymentProviderRoute
      tags: [admin]
      summary: Selects a provider for a country and operator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentProviderRouteInput"
      responses:
        "200":
          description: Provider route saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentProviderRoute"
  /v1/admin/kyc:
    get:
      operationId: listAdminKyc
      tags: [admin]
      summary: Lists KYC cases for operations
      responses:
        "200":
          description: KYC cases
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/KycVerification"
  /v1/admin/kyc/{id}/decision:
    patch:
      operationId: decideKyc
      tags: [admin]
      summary: Applies a KYC decision
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecisionInput"
      responses:
        "200":
          description: KYC decision applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationResult"
  /v1/admin/transactions:
    get:
      operationId: listAdminTransactions
      tags: [admin]
      summary: Lists the operations ledger
      responses:
        "200":
          description: Transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Transaction"
components:
  securitySchemes:
    MulapayApiKey:
      type: http
      scheme: bearer
      bearerFormat: mp_live_<server_key>
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
    Reference:
      name: reference
      in: path
      required: true
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Stable unique key for one payment attempt. Reuse it only when safely retrying the same request.
      schema:
        type: string
        minLength: 1
        maxLength: 128
  responses:
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ProviderUnavailable:
      description: Payment provider unavailable or not configured
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
        code: { type: string }
        otpRequired: { type: boolean }
    Profile:
      type: object
      required: [id, firstName, lastName, email, role, country, kycStatus]
      properties:
        id: { type: string }
        firstName: { type: string }
        lastName: { type: string }
        email: { type: string }
        role: { type: string }
        country: { type: string }
        kycStatus: { type: string }
    Wallet:
      type: object
      required: [id, country, code, currency, balance, pending, status]
      properties:
        id: { type: string }
        country: { type: string }
        code: { type: string }
        currency: { type: string }
        balance: { type: number }
        pending: { type: number }
        status: { type: string }
    Transaction:
      type: object
      required: [id, type, status, amount, currency, country, counterparty, createdAt, reference]
      properties:
        id: { type: string }
        type: { type: string }
        status: { type: string }
        amount: { type: number }
        currency: { type: string }
        country: { type: string }
        counterparty: { type: string }
        createdAt: { type: string }
        reference: { type: string }
    Exchange:
      type: object
      required: [id, source, destination, amount, rate, receivedAmount, fee, status, requestedAt]
      properties:
        id: { type: string }
        sourceWalletId: { type: ["string", "null"] }
        destinationWalletId: { type: ["string", "null"] }
        source: { type: string }
        destination: { type: string }
        amount: { type: number }
        rate: { type: number }
        receivedAmount: { type: number }
        fee: { type: number }
        status: { type: string }
        requestedAt: { type: string }
    PaymentLink:
      type: object
      required: [id, slug, reference, productName, amount, currency, description, walletId, amountType, amountMin, amountMax, customerFields, status, expiresAt, maxPayments, afterPaymentAction, redirectUrl, notifyApp, notifyEmail, notifyWebhook, payments]
      properties:
        id: { type: string }
        slug: { type: string }
        reference: { type: ["string", "null"] }
        productName: { type: string }
        amount: { type: number }
        currency: { type: string }
        description: { type: string }
        walletId: { type: ["string", "null"] }
        amountType: { type: string, enum: [FIXED, CUSTOMER_CHOOSES] }
        amountMin: { type: number }
        amountMax: { type: number }
        customerFields:
          type: array
          items: { type: string, enum: [full_name, country, operator, phone, email] }
        status: { type: string }
        expiresAt: { type: string }
        maxPayments: { type: ["number", "null"] }
        afterPaymentAction: { type: string, enum: [CONFIRMATION, REDIRECT] }
        redirectUrl: { type: ["string", "null"] }
        notifyApp: { type: boolean }
        notifyEmail: { type: boolean }
        notifyWebhook: { type: boolean }
        payments: { type: number }
    PublicPaymentLink:
      type: object
      required: [slug, reference, productName, amount, currency, description, amountType, amountMin, amountMax, customerFields, status, expiresAt, maxPayments, afterPaymentAction, redirectUrl, payments]
      properties:
        slug: { type: string }
        reference: { type: ["string", "null"] }
        productName: { type: string }
        amount: { type: number }
        currency: { type: string }
        description: { type: string }
        amountType: { type: string, enum: [FIXED, CUSTOMER_CHOOSES] }
        amountMin: { type: number }
        amountMax: { type: number }
        customerFields:
          type: array
          items: { type: string, enum: [full_name, country, operator, phone, email] }
        status: { type: string }
        expiresAt: { type: string }
        maxPayments: { type: ["number", "null"] }
        afterPaymentAction: { type: string, enum: [CONFIRMATION, REDIRECT] }
        redirectUrl: { type: ["string", "null"] }
        payments: { type: number }
    Notification:
      type: object
      required: [id, title, body, read]
      properties:
        id: { type: string }
        title: { type: string }
        body: { type: string }
        read: { type: boolean }
    KycVerification:
      type: object
      required: [id, userId, name, country, status, documents, submittedAt]
      properties:
        id: { type: string }
        userId: { type: string }
        name: { type: string }
        country: { type: string }
        status: { type: string }
        documents:
          type: array
          items: { type: string }
        submittedAt: { type: string }
    Bootstrap:
      type: object
      required: [profile, wallets, transactions, exchanges, links, notifications, kyc, feePercentage]
      properties:
        profile: { $ref: "#/components/schemas/Profile" }
        wallets:
          type: array
          items: { $ref: "#/components/schemas/Wallet" }
        transactions:
          type: array
          items: { $ref: "#/components/schemas/Transaction" }
        exchanges:
          type: array
          items: { $ref: "#/components/schemas/Exchange" }
        links:
          type: array
          items: { $ref: "#/components/schemas/PaymentLink" }
        notifications:
          type: array
          items: { $ref: "#/components/schemas/Notification" }
        kyc: { $ref: "#/components/schemas/KycVerification" }
        feePercentage: { type: number, minimum: 0, maximum: 100 }
    AdminSettings:
      type: object
      required: [feePercentage]
      properties:
        feePercentage: { type: number, minimum: 0, maximum: 100 }
    UpdateAdminSettingsInput:
      type: object
      required: [feePercentage]
      properties:
        feePercentage: { type: number, minimum: 0, maximum: 100 }
    OperationResult:
      type: object
      required: [ok, message]
      properties:
        ok: { type: boolean }
        message: { type: string }
        reference: { type: ["string", "null"] }
        status: { type: string }
        amount: { type: number }
        currency: { type: string }
        paymentUrl: { type: ["string", "null"] }
        expiresAt: { type: ["string", "null"], format: date-time }
        fee: { type: number }
        netAmount: { type: number }
        platformFee: { type: number }
        merchantAmount: { type: number }
        totalDebited: { type: number }
    PaymentStatus:
      type: object
      required: [ok, reference, status, amount, currency, createdAt]
      properties:
        ok: { type: boolean }
        reference: { type: string }
        status: { type: string, enum: [Pending, Processing, Completed, Failed, Expired, Cancelled, Reversed] }
        amount: { type: number }
        currency: { type: string }
        fee: { type: ["number", "null"] }
        netAmount: { type: ["number", "null"] }
        platformFee: { type: ["number", "null"] }
        merchantAmount: { type: ["number", "null"] }
        totalDebited: { type: ["number", "null"] }
        paymentUrl: { type: ["string", "null"] }
        expiresAt: { type: ["string", "null"], format: date-time }
        createdAt: { type: string, format: date-time }
    TransferInput:
      type: object
      required: [amount, currency, country, counterparty, feePayer]
      properties:
        amount: { type: number, exclusiveMinimum: 0, maximum: 10000000, description: "Must be an integer." }
        currency: { type: string }
        country: { type: string, minLength: 2 }
        counterparty: { type: string, minLength: 2 }
        note: { type: string }
        feePayer: { type: string, enum: [sender] }
    ExchangeInput:
      type: object
      required: [source, destination, amount]
      properties:
        source: { type: string }
        destination: { type: string }
        amount: { type: number, exclusiveMinimum: 0, description: "Must be an integer." }
    PaymentLinkInput:
      type: object
      required: [currency, productName, description, walletId, amountType, amountMin, amountMax, customerFields, expiresAt, maxPayments, afterPaymentAction, redirectUrl, notifyApp, notifyEmail, notifyWebhook]
      properties:
        amount: { type: ["number", "null"], minimum: 0 }
        currency: { type: string }
        productName: { type: string, minLength: 2 }
        description: { type: string }
        walletId: { type: ["string", "null"] }
        amountType: { type: string, enum: [FIXED, CUSTOMER_CHOOSES] }
        amountMin: { type: number, minimum: 300, maximum: 500000 }
        amountMax: { type: number, minimum: 300, maximum: 500000 }
        customerFields:
          type: array
          items: { type: string, enum: [full_name, country, operator, phone, email] }
        expiresAt: { type: string, description: "ISO 8601 expiration timestamp." }
        maxPayments: { type: ["number", "null"], minimum: 1 }
        afterPaymentAction: { type: string, enum: [CONFIRMATION, REDIRECT] }
        redirectUrl: { type: ["string", "null"] }
        notifyApp: { type: boolean }
        notifyEmail: { type: boolean }
        notifyWebhook: { type: boolean }
    PublicPaymentInput:
      type: object
      required: [amount, fullName, country, operator, phone, email]
      properties:
        amount: { type: number, exclusiveMinimum: 0 }
        fullName: { type: string, minLength: 2 }
        country: { type: string, minLength: 2 }
        operator: { type: string, minLength: 2 }
        phone: { type: string, minLength: 8 }
        email: { type: string, minLength: 3 }
        operatorOtp: { type: string }
    MoneyOperationInput:
      type: object
      required: [walletId, amount, method, country, operator, phone]
      properties:
        walletId: { type: string }
        amount: { type: number, exclusiveMinimum: 0, maximum: 10000000, description: "Must be an integer." }
        method: { type: string, enum: [mobile_money] }
        country: { type: string, minLength: 2 }
        operator: { type: string, minLength: 2 }
        phone: { type: string, pattern: "^\\+[1-9][0-9]{7,14}$" }
    DepositInput:
      type: object
      required: [walletId, amount, method, country, operator, phone]
      properties:
        walletId: { type: string }
        amount: { type: number, exclusiveMinimum: 0, description: "Must be an integer." }
        method: { type: string, enum: [mobile_money] }
        country: { type: string, minLength: 2 }
        operator: { type: string, minLength: 2 }
        phone: { type: string, pattern: "^\\+[1-9][0-9]{7,14}$" }
        operatorOtp: { type: string }
    KycInput:
      type: object
      required: [country, documents]
      properties:
        country: { type: string }
        documents:
          type: array
          minItems: 1
          items: { type: string }
    DecisionInput:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          enum: [APPROVED, REJECTED, VERIFIED, REFUSED]
        reason: { type: string }
    AdminSummary:
      type: object
      required: [kycAwaiting, exchangeQueue, volume, successRate]
      properties:
        kycAwaiting: { type: number }
        exchangeQueue: { type: number }
        volume: { type: number }
        successRate: { type: number }
    AdminPaymentProvider:
      type: object
      required: [id, label, configured]
      properties:
        id: { type: string, enum: [DRIMPAY, ASHTECHPAY] }
        label: { type: string }
        configured: { type: boolean }
    AdminPaymentProviders:
      type: object
      required: [providers]
      properties:
        providers:
          type: array
          items:
            $ref: "#/components/schemas/AdminPaymentProvider"
    PaymentProviderRoute:
      type: object
      required: [id, countryCode, country, operator, providerOperator, provider, enabled, updatedAt]
      properties:
        id: { type: string }
        countryCode: { type: string }
        country: { type: string }
        operator: { type: string }
        providerOperator: { type: string }
        provider: { type: string, enum: [DRIMPAY, ASHTECHPAY] }
        enabled: { type: boolean }
        updatedAt: { type: string, format: date-time }
    PaymentProviderRouteInput:
      type: object
      required: [countryCode, country, operator, providerOperator, provider]
      properties:
        countryCode: { type: string }
        country: { type: string }
        operator: { type: string }
        providerOperator: { type: string }
        provider: { type: string, enum: [DRIMPAY, ASHTECHPAY] }
        enabled: { type: boolean }